name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5433/test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # GitHub Actions `services:` cannot pass server flags, and pg_stat_statements
      # must be in shared_preload_libraries, so start Postgres with docker compose.
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres-test

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push Prisma schema
        run: npx prisma db push --schema tests/prisma/schema.prisma

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
